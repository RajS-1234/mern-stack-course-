<!DOCTYPE html>
<html lang="en" style="font-size:30px;">
<head>
               <meta charset="UTF-8">
               <meta name="viewport" content="width=device-width, initial-scale=1.0">
               <title>Document</title>
</head>
<body >
      <section style=" background-color: yellow; font-size: 20px;">
             <div style=" background-color: blue; font-size: 50px" >
                     <h1 style="font-size: 3em;">hello Coder Army</h1>
                     <h1>hello Coder Army</h1>
                     <!--<h2 style="font-size: 2rem;">Strike is Comming soon</h2>-->
                     <div>
                        <h3 style="font-size: 2em;">paswan ji</h3> <!--text will be 2*50=100px -->
                        <p>sonu kumar</p>  <!--text will be 50px  ==>> agra ham kio v parent div par style apply karte hai to wo pura children div ke andar apply hoga -->
                        <p style="font-size: 50px;">sonu kumar</p>
                     </div>


               </div>
               <div style="">
                    <p style="font-size: 10px;">rajneesh kumar</p>
               <h4 style="font-size: 3em;">my name is rajneesh kumar</h4> <!--text will be 3*30=90px || h4 ne apna font-size html ke context me change kiya hai, -->
               </div>
      </section>
              
</body>
</html>




<!--
This is a comment block.
concept 01:
em -- relative to the font-size of the element(parent)
rem -- relative to the font-size of the root element(html)

1em = 16px (by default)
1rem = 16px (by default)

ham kisi bhi tag ko parent's container nahi manege like(h1-h6,p,image,span etc)
ham parent's bolenge iska matlab div,section,body,html(main body) etc.

concept 02:
veiwport height and viewport width:
ye hamesha browser ke hisab se change hota raheta hai.
ispar koiv position ka asar nahi hota hai.
1vh = 1% of viewport height
1vw = 1% of viewport width
-->
